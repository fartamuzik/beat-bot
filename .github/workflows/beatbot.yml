name: beat-bot

# Бот дежурит сменами по ~5,5 часа и сам запускает следующую смену.
# Расписание — запасной вариант: если смена почему-то оборвалась, новая начнётся в течение получаса.
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: beat-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg и библиотеки
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg > /dev/null
          fi
          sudo apt-get install -y -qq fonts-dejavu-core > /dev/null || true
          pip install -q numpy pillow opencv-python-headless

      - name: Шрифты из кэша
        uses: actions/cache@v4
        with:
          path: fonts
          key: fonts-v2

      - name: Кэш поиска фонов
        uses: actions/cache@v4
        with:
          path: pxcache
          key: pxcache-${{ github.run_id }}
          restore-keys: pxcache-

      - name: Бот на связи
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          PRODUCER_NAME: ${{ secrets.PRODUCER_NAME }}
          GH_TOKEN: ${{ github.token }}
          LISTEN_MIN: "320"
        run: python bot.py serve

      - name: Не даём GitHub выключить бота
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            git config user.name "beat-bot"
            git config user.email "beat-bot@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi

        
